services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres-pldotnet
    container_name: auditdb-pldotnet
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auditdb
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auditdb"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
